<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <title>Input Transaksi</title>

  <style>
    /* Reset & Layout Rules */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 10px;
      background: #f0f2f5;
      color: #111;
      -webkit-tap-highlight-color: transparent;
    }

    .card {
      background: #ffffff;
      padding: 18px 12px;
      border-radius: 12px;
      width: 100%;
      max-width: 100%;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    h2 {
      text-align: center;
      font-size: 24px;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 18px;
    }

    label.section-title {
      font-weight: 800;
      display: block;
      margin-top: 20px;
      margin-bottom: 8px;
      font-size: 18px;
      color: #0f172a;
    }

    .radio-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      width: 100%;
    }

    .radio-group label {
      flex: 1 1 calc(33.33% - 8px);
      min-width: 60px;
      text-align: center;
      padding: 14px 4px;
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 700;
      color: #1e293b;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .radio-group input[type="radio"] {
      accent-color: #e67e22;
      width: 20px;
      height: 20px;
    }

    input[type="text"], textarea {
      width: 100%;
      max-width: 100%;
      padding: 14px;
      margin-top: 6px;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      font-size: 20px;
      font-weight: 600;
      color: #0f172a;
      outline: none;
      background: #fff;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: #e67e22;
      box-shadow: 0 0 0 3px rgba(230, 126, 34, 0.25);
    }

    .sub-label {
      font-size: 14px;
      font-weight: 500;
      color: #475569;
      margin-top: 6px;
      line-height: 1.3;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 24px;
      background: #e67e22;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(230, 126, 34, 0.3);
      transition: all 0.2s ease;
    }

    button:active {
      background: #d35400;
      transform: scale(0.98);
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
      box-shadow: none;
    }

    button.btn-success {
      background: #16a34a !important;
      box-shadow: 0 4px 10px rgba(22, 163, 74, 0.3) !important;
    }

    #status {
      margin-top: 16px;
      text-align: center;
      font-weight: 800;
      font-size: 17px;
      color: #15803d;
      min-height: 24px;
      transition: opacity 0.3s ease;
    }

    .saldo-header {
      margin-top: 28px;
      border-top: 2px dashed #cbd5e1;
      padding-top: 20px;
    }

    .saldo-title {
      color: #e67e22;
      font-weight: 800;
      font-size: 22px;
      text-align: center;
    }

    .keterangan {
      font-size: 14px;
      font-weight: 600;
      color: #64748b;
      text-align: center;
      margin-bottom: 12px;
    }

    table {
      width: 100%;
      max-width: 100%;
      table-layout: fixed;
      border-collapse: separate;
      border-spacing: 0;
      margin-top: 8px;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid #cbd5e1;
    }

    th {
      background: #e2e8f0;
      color: #0f172a;
      font-weight: 800;
      font-size: 17px;
      padding: 12px 10px;
      border-bottom: 2px solid #cbd5e1;
      text-align: center;
    }

    td {
      padding: 14px 10px;
      font-size: 18px;
      color: #0f172a;
      border-bottom: 1px solid #e2e8f0;
      word-wrap: break-word;
      text-align: center;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:nth-child(even) {
      background-color: #f8fafc;
    }

    .center-text {
      text-align: center;
      font-weight: 800;
      color: #1e293b;
    }
  </style>
</head>

<body>

<div class="card">

  <h2>INPUT TRANSAKSI</h2>

  <label class="section-title">Kode</label>
  <div class="radio-group">
    <label><input type="radio" name="kode" value="HA" checked> HA</label>
    <label><input type="radio" name="kode" value="RIN"> RIN</label>
    <label><input type="radio" name="kode" value="ZA"> ZA</label>
    <label><input type="radio" name="kode" value="NAN"> NAN</label>
    <label><input type="radio" name="kode" value="KAM"> KAM</label>
  </div>

  <label class="section-title">Jenis</label>
  <div class="radio-group">
    <label><input type="radio" name="jenis" value="Masuk" checked> Masuk</label>
    <label><input type="radio" name="jenis" value="Keluar"> Keluar</label>
  </div>

  <label class="section-title">Nominal</label>
  <input id="nominal" type="text" inputmode="numeric" placeholder="Contoh: 100" oninput="formatNominal(this)">
  <div class="sub-label">Nominal dalam ribuan. Contoh bila 100.000 maka tulis 100</div>

  <label class="section-title">Uraian</label>
  <textarea id="keterangan" rows="3" placeholder="Masukkan keterangan..."></textarea>

  <button id="btnKirim" onclick="kirim()">KIRIM</button>

  <div id="status"></div>

  <div class="saldo-header">
    <div class="saldo-title">Bank AMi Syariah</div>
    <div class="keterangan">dalam ribuan rupiah</div>

    <table>
      <thead>
        <tr>
          <th style="width: 50%;">Nama</th>
          <th style="width: 50%;">Saldo</th>
        </tr>
      </thead>
      <tbody id="saldo">
        <tr><td colspan="2">Memuat saldo...</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby1ZI7cwjU9aJIkMral63401WwjxQ4o-8MOjKZoB8Gh1C_u21Ti2LNS0WDU3t2TYJ8Qtg/exec";
  
  // Cache DOM element references
  const nominalInput = document.getElementById("nominal");
  const keteranganInput = document.getElementById("keterangan");
  const btnKirim = document.getElementById("btnKirim");
  const statusEl = document.getElementById("status");
  const saldoBody = document.getElementById("saldo");

  let localSaldoData = [];

  function formatNominal(el) {
    let raw = el.value.replace(/\D/g, '');
    el.value = raw ? Number(raw).toLocaleString("id-ID") : "";
  }

  function renderTable(data) {
    if (!data || data.length === 0) {
      saldoBody.innerHTML = "<tr><td colspan='2'>Tidak ada data</td></tr>";
      return;
    }

    const fragment = document.createDocumentFragment();
    data.forEach(r => {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${r.nama}</td><td class="center-text">${Number(r.saldo).toLocaleString("id-ID")}</td>`;
      fragment.appendChild(tr);
    });

    saldoBody.innerHTML = "";
    saldoBody.appendChild(fragment);
  }

  function loadSaldo() {
    fetch(SCRIPT_URL, { redirect: "follow" })
      .then(res => {
        if (!res.ok) throw new Error("Gagal mengambil data");
        return res.json();
      })
      .then(data => {
        localSaldoData = data;
        renderTable(data);
      })
      .catch(err => {
        console.error("Error loading saldo:", err);
        saldoBody.innerHTML = "<tr><td colspan='2' style='color:red;'>Gagal memuat saldo</td></tr>";
      });
  }

  function updateOptimisticSaldo(kode, jenis, nominalVal) {
    const numericNominal = parseInt(nominalVal.replace(/\./g, ''), 10) || 0;
    
    // Cari dan perbarui saldo secara langsung di memori
    localSaldoData = localSaldoData.map(item => {
      if (item.nama === kode) {
        let currentSaldo = Number(item.saldo);
        let newSaldo = jenis === "Masuk" ? currentSaldo + numericNominal : currentSaldo - numericNominal;
        return { ...item, saldo: newSaldo };
      }
      return item;
    });

    // Render ulang tabel secara instan
    renderTable(localSaldoData);
  }

  function kirim() {
    let rawNominal = nominalInput.value.trim();
    if (!rawNominal) {
      alert("Nominal harus diisi");
      return;
    }

    let kode = document.querySelector('input[name="kode"]:checked').value;
    let jenis = document.querySelector('input[name="jenis"]:checked').value;

    let payload = {
      kode: kode,
      jenis: jenis,
      nominal: rawNominal,
      keterangan: keteranganInput.value
    };

    // 1. Simpan backup data lokal untuk rollback jika gagal
    const previousSaldoData = JSON.parse(JSON.stringify(localSaldoData));

    // 2. Pembaruan UI Optimistis (Langsung ganti saldo di layar tanpa menunggu respons server)
    updateOptimisticSaldo(kode, jenis, rawNominal);

    // 3. Set visual status pengiriman
    btnKirim.disabled = true;
    btnKirim.innerText = "MENGIRIM...";
    statusEl.style.color = "#15803d";
    statusEl.innerHTML = "⏳ Memproses transaksi...";

    // 4. Kirim request dengan tipe URL-encoded untuk menghindari delay CORS preflight
    fetch(SCRIPT_URL, {
      method: 'POST',
      redirect: 'follow',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded'
      },
      body: new URLSearchParams(payload)
    })
    .then(res => res.json())
    .then(res => {
      if (res.status === true || res.status === "success") {
        btnKirim.classList.add("btn-success");
        btnKirim.innerText = "✔ BERHASIL DISIMPAN";
        
        statusEl.style.color = "#15803d";
        statusEl.innerHTML = "✅ " + (res.message || "Transaksi berhasil diterima!");
        
        nominalInput.value = "";
        keteranganInput.value = "";

        // Sinkronisasi ulang dengan data server asli untuk memastikan konsistensi
        loadSaldo();

        setTimeout(() => {
          btnKirim.classList.remove("btn-success");
          btnKirim.innerText = "KIRIM";
          btnKirim.disabled = false;
        }, 2000);

      } else {
        // Rollback saldo jika server menolak
        localSaldoData = previousSaldoData;
        renderTable(localSaldoData);

        btnKirim.innerText = "KIRIM";
        btnKirim.disabled = false;
        statusEl.style.color = "#b91c1c";
        statusEl.innerHTML = "❌ Gagal: " + res.message;
      }
    })
    .catch(err => {
      // Rollback saldo jika koneksi error
      localSaldoData = previousSaldoData;
      renderTable(localSaldoData);

      console.error(err);
      btnKirim.innerText = "KIRIM";
      btnKirim.disabled = false;
      statusEl.style.color = "#b91c1c";
      statusEl.innerHTML = "❌ Terjadi kesalahan jaringan";
    });
  }

  // Load saldo awal
  loadSaldo();
</script>

</body>
</html>
