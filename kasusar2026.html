<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kas Usar 2026</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --success-color: #16a34a;
            --danger-color: #dc2626;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1, h2 {
            text-align: center;
            color: #0f172a;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 24px;
            margin-bottom: 24px;
        }

        /* Tabel Saldo */
        .saldo-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            text-align: center;
        }

        .saldo-table th, .saldo-table td {
            border: 1px solid #cbd5e1;
            padding: 10px;
        }

        .saldo-table th {
            background-color: #f1f5f9;
            font-weight: 600;
        }

        /* Form Styling */
        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            color: white;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .btn-masuk {
            background-color: var(--success-color);
        }

        .btn-keluar {
            background-color: var(--danger-color);
        }

        .hidden {
            display: none;
        }

        #loading {
            text-align: center;
            font-style: italic;
            color: #64748b;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Kas Usar 2026</h1>

    <!-- TABEL SALDO -->
    <div class="card">
        <h2>Tabel Saldo</h2>
        <table class="saldo-table" id="tabelSaldo">
            <thead>
                <tr>
                    <th>ITB</th>
                    <th>IWB</th>
                    <th>IPD</th>
                    <th>SS</th>
                    <th>Rihlah</th>
                    <th>Kas</th>
                    <th>Taawun</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td id="saldo-ITB">Rp 0</td>
                    <td id="saldo-IWB">Rp 0</td>
                    <td id="saldo-IPD">Rp 0</td>
                    <td id="saldo-SS">Rp 0</td>
                    <td id="saldo-Rihlah">Rp 0</td>
                    <td id="saldo-Kas">Rp 0</td>
                    <td id="saldo-Taawun">Rp 0</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- FORM INPUT TRANSAKSI -->
    <div class="card">
        <h2>Input Transaksi</h2>
        
        <div class="form-group">
            <label for="jenisTransaksi">Pilih Jenis Transaksi:</label>
            <select id="jenisTransaksi" onchange="toggleForm()">
                <option value="masuk">Pemasukan</option>
                <option value="keluar">Pengeluaran</option>
            </select>
        </div>

        <form id="formKas" onsubmit="submitData(event)">
            <!-- Kolom Nama -->
            <div class="form-group">
                <label id="labelNamaUraian" for="namaUraianContainer">Nama:</label>
                <div id="namaUraianContainer">
                    <select id="namaUraianSelect" required>
                        <option value="">-- Pilih Nama --</option>
                        <option value="Dian L">Dian L</option>
                        <option value="Kholifah">Kholifah</option>
                        <option value="Kokom">Kokom</option>
                        <option value="Roisah">Roisah</option>
                        <option value="Teny">Teny</option>
                        <option value="Tuti">Tuti</option>
                        <option value="Umiyati">Umiyati</option>
                    </select>
                </div>
            </div>

            <!-- Kolom Keterangan -->
            <div class="form-group">
                <label for="keteranganContainer">Keterangan:</label>
                <div id="keteranganContainer">
                    <select id="keteranganSelect" required>
                        <option value="">-- Pilih Bulan --</option>
                        <option value="Januari">Januari</option>
                        <option value="Februari">Februari</option>
                        <option value="Maret">Maret</option>
                        <option value="April">April</option>
                        <option value="Mei">Mei</option>
                        <option value="Juni">Juni</option>
                        <option value="Juli">Juli</option>
                        <option value="Agustus">Agustus</option>
                        <option value="September">September</option>
                        <option value="Oktober">Oktober</option>
                        <option value="November">November</option>
                        <option value="Desember">Desember</option>
                    </select>
                </div>
            </div>

            <!-- Field khusus Pengeluaran -->
            <div id="sectionKeluar" class="hidden">
                <h3>Nilai Pengeluaran (Otomatis Negatif)</h3>
                <div class="form-group"><label>ITB:</label><input type="text" id="keluar_ITB" value="0" onkeyup="formatRibuan(this)"></div>
                <div class="form-group"><label>IWB:</label><input type="text" id="keluar_IWB" value="0" onkeyup="formatRibuan(this)"></div>
                <div class="form-group"><label>IPD:</label><input type="text" id="keluar_IPD" value="0" onkeyup="formatRibuan(this)"></div>
                <div class="form-group"><label>SS:</label><input type="text" id="keluar_SS" value="0" onkeyup="formatRibuan(this)"></div>
                <div class="form-group"><label>Rihlah:</label><input type="text" id="keluar_Rihlah" value="0" onkeyup="formatRibuan(this)"></div>
                <div class="form-group"><label>Kas:</label><input type="text" id="keluar_Kas" value="0" onkeyup="formatRibuan(this)"></div>
                <div class="form-group"><label>Taawun:</label><input type="text" id="keluar_Taawun" value="0" onkeyup="formatRibuan(this)"></div>
            </div>

            <div class="btn-group">
                <button type="submit" id="btnSubmit" class="btn-masuk">Simpan Pemasukan</button>
            </div>
        </form>
        <div id="loading" class="hidden">Menyimpan data ke Google Sheets...</div>
    </div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyoFDSiQmmGrG6nh8EqOm1zhzqGOr9s97lspw6ZsAhtrAJH1AeSKezVf4zk05MUg1ln/exec';
    const spreadsheetId = '1ZK6EDgxTp5tIoqhi2S4nHw_GxjVWT7dtOz-3sU1UpdM'; 
    const gvizURL = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?sheet=Kas`;

    window.onload = function() {
        loadSaldo();
    };

    function loadSaldo() {
        fetch(gvizURL)
            .then(res => res.text())
            .then(rep => {
                const jsonData = JSON.parse(rep.substring(47).slice(0, -2));
                const rows = jsonData.table.rows;

                let totalITB = 0;
                let totalIWB = 0;
                let totalIPD = 0;
                let totalSS = 0;
                let totalRihlah = 0;
                let totalKas = 0;
                let totalTaawun = 0;

                rows.forEach(row => {
                    if (row.c) {
                        totalITB += row.c[3] ? (row.c[3].v || 0) : 0;
                        totalIWB += row.c[4] ? (row.c[4].v || 0) : 0;
                        totalIPD += row.c[5] ? (row.c[5].v || 0) : 0;
                        totalSS += row.c[6] ? (row.c[6].v || 0) : 0;
                        totalRihlah += row.c[7] ? (row.c[7].v || 0) : 0;
                        totalKas += row.c[8] ? (row.c[8].v || 0) : 0;
                        totalTaawun += row.c[9] ? (row.c[9].v || 0) : 0;
                    }
                });

                document.getElementById('saldo-ITB').innerText = formatRupiahText(totalITB);
                document.getElementById('saldo-IWB').innerText = formatRupiahText(totalIWB);
                document.getElementById('saldo-IPD').innerText = formatRupiahText(totalIPD);
                document.getElementById('saldo-SS').innerText = formatRupiahText(totalSS);
                document.getElementById('saldo-Rihlah').innerText = formatRupiahText(totalRihlah);
                document.getElementById('saldo-Kas').innerText = formatRupiahText(totalKas);
                document.getElementById('saldo-Taawun').innerText = formatRupiahText(totalTaawun);
            })
            .catch(err => {
                console.error('Gagal memuat saldo:', err);
            });
    }

    function formatRupiahText(angka) {
        return 'Rp ' + angka.toLocaleString('id-ID');
    }

    // Fungsi untuk otomatis format ribuan saat mengetik angka
    function formatRibuan(input) {
        let value = input.value.replace(/[^,\d]/g, '').toString();
        let split = value.split(',');
        let sisa = split[0].length % 3;
        let rupiah = split[0].substr(0, sisa);
        let ribuan = split[0].substr(sisa).match(/\d{3}/gi);

        if (ribuan) {
            let separator = sisa ? '.' : '';
            rupiah += separator + ribuan.join('.');
        }

        rupiah = split[1] !== undefined ? rupiah + ',' + split[1] : rupiah;
        input.value = rupiah;
    }

    // Helper untuk mengambil nilai angka mentah dari input berformat ribuan
    function parseNumber(id) {
        let val = document.getElementById(id).value;
        if (!val) return 0;
        return Number(val.replace(/\./g, '')) || 0;
    }

    function toggleForm() {
        const jenis = document.getElementById('jenisTransaksi').value;
        const sectionKeluar = document.getElementById('sectionKeluar');
        const btnSubmit = document.getElementById('btnSubmit');
        const labelNamaUraian = document.getElementById('labelNamaUraian');
        const containerNama = document.getElementById('namaUraianContainer');
        const containerKeterangan = document.getElementById('keteranganContainer');

        if (jenis === 'keluar') {
            sectionKeluar.classList.remove('hidden');
            btnSubmit.className = 'btn-keluar';
            btnSubmit.innerText = 'Simpan Pengeluaran';
            
            labelNamaUraian.innerText = 'Nama / Uraian:';
            containerNama.innerHTML = `<input type="text" id="namaUraianInput" required placeholder="Masukkan Nama atau Uraian">`;
            
            // Keterangan tidak wajib diisi (tanpa atribut required)
            containerKeterangan.innerHTML = `<input type="text" id="keteranganInput" placeholder="Masukkan Keterangan (Opsional)">`;
        } else {
            sectionKeluar.classList.add('hidden');
            btnSubmit.className = 'btn-masuk';
            btnSubmit.innerText = 'Simpan Pemasukan';
            
            labelNamaUraian.innerText = 'Nama:';
            containerNama.innerHTML = `
                <select id="namaUraianSelect" required>
                    <option value="">-- Pilih Nama --</option>
                    <option value="Dian L">Dian L</option>
                    <option value="Kholifah">Kholifah</option>
                    <option value="Kokom">Kokom</option>
                    <option value="Roisah">Roisah</option>
                    <option value="Teny">Teny</option>
                    <option value="Tuti">Tuti</option>
                    <option value="Umiyati">Umiyati</option>
                </select>
            `;
            
            containerKeterangan.innerHTML = `
                <select id="keteranganSelect" required>
                    <option value="">-- Pilih Bulan --</option>
                    <option value="Januari">Januari</option>
                    <option value="Februari">Februari</option>
                    <option value="Maret">Maret</option>
                    <option value="April">April</option>
                    <option value="Mei">Mei</option>
                    <option value="Juni">Juni</option>
                    <option value="Juli">Juli</option>
                    <option value="Agustus">Agustus</option>
                    <option value="September">September</option>
                    <option value="Oktober">Oktober</option>
                    <option value="November">November</option>
                    <option value="Desember">Desember</option>
                </select>
            `;
        }
    }

    function submitData(e) {
        e.preventDefault();
        
        const jenis = document.getElementById('jenisTransaksi').value;
        let namaUraian = '';
        let keterangan = '';
        let jenisStatus = '';

        if (jenis === 'masuk') {
            namaUraian = document.getElementById('namaUraianSelect').value;
            keterangan = document.getElementById('keteranganSelect').value;
            jenisStatus = 'Masuk';
        } else {
            namaUraian = document.getElementById('namaUraianInput').value;
            // Jika kosong, isi strip atau kosong (-)
            keterangan = document.getElementById('keteranganInput').value || '-';
            jenisStatus = 'Keluar';
        }
        
        const sekarang = new Date();
        const waktu = sekarang.toLocaleString('id-ID');

        let dataValues = {
            waktu: waktu,
            namaUraian: namaUraian,
            status: jenisStatus,
            ITB: 0, IWB: 0, IPD: 0, SS: 0, Rihlah: 0, Kas: 0, Taawun: 0,
            keterangan: keterangan
        };

        if (jenis === 'masuk') {
            dataValues.ITB = 50000;
            dataValues.IWB = 0; 
            dataValues.IPD = 25000;
            dataValues.SS = 15000;
            dataValues.Rihlah = 30000;
            dataValues.Kas = 20000;
            dataValues.Taawun = 10000;
        } else {
            // Mengambil angka mentah dengan membersihkan titik format ribuan
            dataValues.ITB = -Math.abs(parseNumber('keluar_ITB'));
            dataValues.IWB = -Math.abs(parseNumber('keluar_IWB'));
            dataValues.IPD = -Math.abs(parseNumber('keluar_IPD'));
            dataValues.SS = -Math.abs(parseNumber('keluar_SS'));
            dataValues.Rihlah = -Math.abs(parseNumber('keluar_Rihlah'));
            dataValues.Kas = -Math.abs(parseNumber('keluar_Kas'));
            dataValues.Taawun = -Math.abs(parseNumber('keluar_Taawun'));
        }

        document.getElementById('loading').classList.remove('hidden');

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dataValues)
        })
        .then(() => {
            alert('Data berhasil disimpan!');
            document.getElementById('formKas').reset();
            toggleForm();
            document.getElementById('loading').classList.add('hidden');
            setTimeout(loadSaldo, 2000);
        })
        .catch(error => {
            console.error('Error!', error.message);
            alert('Gagal menyimpan data. Silakan coba lagi.');
            document.getElementById('loading').classList.add('hidden');
        });
    }
</script>

</body>
</html>
